<h1>
    <ul>
        {% for task in tasks %}
        <li>
            <a href="{{ url_for('tasks.get_task', task_id=task.id) }}">{{task.title}}</a>
            <form action="{{ url_for('tasks.delete_tasks', task_id=task.id) }}" method="post">
                <button type="submit">Удалить  задачу</button>
            </form>
        </li>
        {% endfor %}
    </ul>
</h1>

<a href="{{ url_for(tasks.add_task) }}">Добавить новую задачу</a>
